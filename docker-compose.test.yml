services:
  database:
    image: postgres:17.5-alpine
    container_name: cleverjs-test-postgres
    env_file:
      - .env.test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=64MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 5s
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-CU27-ubuntu-20.04
    platform: linux/amd64
    container_name: cleverjs-test-mssql
    env_file:
      - .env.test
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    tmpfs:
      - /var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  mssql-init:
    image: mcr.microsoft.com/mssql/server:2019-CU27-ubuntu-20.04
    platform: linux/amd64
    container_name: cleverjs-test-mssql-init
    depends_on:
      mssql:
        condition: service_healthy
    env_file:
      - .env.test
    entrypoint:
      - /bin/bash
      - -c
      - /opt/mssql-tools/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -Q "IF DB_ID('$$MSSQL_DB') IS NULL CREATE DATABASE [$$MSSQL_DB]"
    restart: "no"

volumes: {}

