name: Release Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-package-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  POSTGRES_USER: test_db
  POSTGRES_PASSWORD: test_db
  POSTGRES_DB: test_db
  MSSQL_USER: sa
  MSSQL_PASSWORD: 'YourStrong!Passw0rd'
  MSSQL_SA_PASSWORD: 'YourStrong!Passw0rd'
  MSSQL_DB: test_db

jobs:
  test:
    name: Validate (install, typecheck, test, build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mssql:
        image: mcr.microsoft.com/mssql/server:2019-CU27-ubuntu-20.04
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ env.MSSQL_SA_PASSWORD }}
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies (immutable)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.build.json
      - name: Init MSSQL database
        env:
          MSSQL_CONTAINER_ID: ${{ job.services.mssql.id }}
        run: |
          docker exec "$MSSQL_CONTAINER_ID" \
            /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" \
            -Q "IF DB_ID('$MSSQL_DB') IS NULL CREATE DATABASE [$MSSQL_DB]"
      - name: Run tests
        run: pnpm run tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5433
          MSSQL_HOST: localhost
          MSSQL_PORT: 1433
      - name: Build package
        run: pnpm run build
      - name: Verify optional peer dependency contract
        run: pnpm run check:peers
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  publish-gpr:
    name: Publish to GitHub Packages
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write
      attestations: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package version
        if: github.event_name == 'release'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Strip 'v' prefix if present (e.g., v1.0.0 -> 1.0.0)
          # Both formats are supported: v1.0.0 or 1.0.0
          if [[ "$TAG" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+(-.+)?)$ ]]; then
            VERSION_IN_TAG="${BASH_REMATCH[1]}"
          else
            echo "❌ Release tag '$TAG' does not match semver format." >&2
            echo "Expected format: 1.0.0 or v1.0.0 (with optional pre-release suffix)" >&2
            exit 1
          fi
          VERSION_IN_PKG=$(node -p "require('./package.json').version")
          echo "📌 Tag version: $VERSION_IN_TAG"
          echo "📦 Package.json version: $VERSION_IN_PKG"
          if [ "$VERSION_IN_TAG" != "$VERSION_IN_PKG" ]; then
            echo "❌ Tag version and package.json version mismatch." >&2
            exit 1
          fi
          echo "✅ Version verification passed"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          registry-url: https://npm.pkg.github.com/
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Verify build artifacts
        run: |
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "❌ Build artifacts missing or empty" >&2
            exit 1
          fi
          echo "✅ Build artifacts verified"
      - name: Install dependencies (immutable)
        run: pnpm install --frozen-lockfile --prod
      - name: Determine npm tag
        id: npm-tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=next" >> $GITHUB_OUTPUT
            echo "📌 Pre-release version detected, using 'next' tag"
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "📌 Stable version detected, using 'latest' tag"
          fi
      - name: Dry run publish
        if: inputs.dry_run == true
        run: |
          echo "🔍 Dry run mode - skipping actual publish"
          pnpm publish --dry-run --no-git-checks --ignore-scripts
      - name: Publish to GitHub Packages
        if: inputs.dry_run != true
        run: |
          echo "📦 Publishing to GitHub Packages..."
          pnpm publish --tag=${{ steps.npm-tag.outputs.tag }} --access public --no-git-checks --provenance --ignore-scripts
